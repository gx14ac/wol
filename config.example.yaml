listen: "0.0.0.0:7777"
broadcast: "255.255.255.255"
port: 9

# Base URL of the runetale dashboard. Set it to show a remote desktop link
# next to any machine that also has a runetale_ip.
# runetale_dashboard: "https://console.example.com"

machines:
  - name: desktop
    mac: "aa:bb:cc:dd:ee:ff"
    ip: "192.168.1.100"
    # Overlay address inside the mesh, if this machine is on runetale. The ip
    # above stays the LAN address used to wake and ping it.
    # runetale_ip: "100.107.0.36"
  - name: server
    mac: "11:22:33:44:55:66"
    ip: "192.168.1.200"
    broadcast: "10.0.0.255"
    port: 7

schedules:
  - machine: desktop
    cron: "0 30 8 * * Mon-Fri"
